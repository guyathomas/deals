name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Build runs npm ci; keep deploy rights out of that job's token.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check for exported snapshot
        run: |
          if [ ! -f web/public/api/sites.json ]; then
            echo "::error::No snapshot found. Run 'npm run export' locally and commit web/public/api."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        env:
          VITE_STATIC_DATA: 'true'
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: SPA fallback for deep links
        run: cp web/dist/index.html web/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
